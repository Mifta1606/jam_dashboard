<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; height:100%; background:transparent; }
  body { display:flex; flex-direction:column; align-items:center;
         justify-content:center; font-family:Arial, sans-serif; color:#222; }
  #time { font-size:48px; font-weight:bold; letter-spacing:2px; }
  #date { font-size:18px; margin-top:4px; }
</style>
</head>
<body>
  <div id="time"></div>
  <div id="date"></div>
  <script>
    function tick() {
      const now = new Date();
      document.getElementById('time').textContent =
        now.toLocaleTimeString('id-ID', { timeZone:'Asia/Jakarta', hour12:false })
          .replace(/\./g, ':') + ' WIB';
      document.getElementById('date').textContent =
        now.toLocaleDateString('id-ID', { timeZone:'Asia/Jakarta',
          weekday:'long', day:'numeric', month:'long', year:'numeric' });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
